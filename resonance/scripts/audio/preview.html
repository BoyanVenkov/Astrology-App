<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Breath Awareness — audio test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
  h1 { font-size: 1.2rem; }
  h2 { font-size: 1rem; opacity: 0.7; margin-top: 32px; }
  .line { margin: 18px 0; padding: 12px; background: #1c1c1c; border-radius: 8px; }
  .line p { margin: 0 0 8px; font-size: 0.95rem; }
  audio { width: 100%; }
</style>
</head>
<body>
<h1>Breath Awareness — Inworld voice test</h1>

<h2>English</h2>
<div class="line"><p>00 — briefing (lead)</p><audio controls src="output/en/00-briefing-lead.mp3"></audio></div>
<div class="line"><p>01 — briefing (close)</p><audio controls src="output/en/01-briefing-close.mp3"></audio></div>
<div class="line"><p>02 — settle</p><audio controls src="output/en/02-settle.mp3"></audio></div>
<div class="line"><p>03 — breath</p><audio controls src="output/en/03-breath.mp3"></audio></div>
<div class="line"><p>04 — count</p><audio controls src="output/en/04-count.mp3"></audio></div>
<div class="line"><p>05 — close</p><audio controls src="output/en/05-close.mp3"></audio></div>

<h2>Bulgarian</h2>
<div class="line"><p>00 — briefing (lead)</p><audio controls src="output/bg/00-briefing-lead.mp3"></audio></div>
<div class="line"><p>01 — briefing (close)</p><audio controls src="output/bg/01-briefing-close.mp3"></audio></div>
<div class="line"><p>02 — settle</p><audio controls src="output/bg/02-settle.mp3"></audio></div>
<div class="line"><p>03 — breath</p><audio controls src="output/bg/03-breath.mp3"></audio></div>
<div class="line"><p>04 — count</p><audio controls src="output/bg/04-count.mp3"></audio></div>
<div class="line"><p>05 — close</p><audio controls src="output/bg/05-close.mp3"></audio></div>

</body>
</html>
