<script>
const CLIPS = 'CLIP_DIR', ART = 'ART_DIR', GEN = 'GEN_DIR'
const FRAMES = window.__FRAMES
const FPS = 24, W = 1080, H = 1920, DPR = 2
const $ = (id) => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ramp = (t, a, b) => clamp((t - a) / (b - a))
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)
const easeIn = (x) => Math.pow(clamp(x), 3)
const lerp = (a, b, k) => a + (b - a) * k
const env = (t, a, b, c, d) => ramp(t, a, b) * (1 - ramp(t, c, d))
const rng = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }

const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.appendChild(e); return e }
const VS = '︎'

/* ------------------------------------------------------------ the edit (45s) */

/* ------------------------------------------------------------ stars */
const stars = $('stars'), sctx = stars.getContext('2d')
stars.width = W * DPR; stars.height = H * DPR; sctx.scale(DPR, DPR)
const STARS = (() => { const r = rng(7); return Array.from({ length: 1100 }, () => ({ x: (r() * 2 - 1) * 1.4, y: (r() * 2 - 1) * 1.4, z: r(), m: .5 + r() * .9, w: r() < .12 })) })()
const speedAt = (t) => {

  if (t < 15.9) return 0.04 + 1.0 * Math.sin(Math.PI * ramp(t, 13.5, 15.9))     // flying through the orbits

  return 0.006
}
const DIST = (() => { const a = [0]; let d = 0; for (let i = 1; i <= 46 * 96; i++) { d += speedAt(i / 96) / 96; a.push(d) } return a })()
const distAt = (t) => DIST[Math.min(DIST.length - 1, Math.max(0, Math.round(t * 96)))]
function drawStars(t, alpha, cx = 540, cy = 960) {
  sctx.clearRect(0, 0, W, H)
  if (alpha <= 0) return
  const D = distAt(t), sp = speedAt(t), f = 520
  sctx.globalCompositeOperation = 'lighter'

    const z = 1 - ((1 - s.z + D) % 1), zz = 0.02 + z * 0.98
    const x = cx + s.x / zz * f * .5, y = cy + s.y / zz * f * .5

  }

  // ---- through the orbits → the geometry → the app ----

    const a = o.ph + (t - 13.5) * o.sp * 3

  // ---- tarot from gold particles, the rune suspended in space ----
  const cwrap = $('cardWrap'), card = $('card'), c0 = 21.75 + CARD_SHIFT

    const appear = easeOut(ramp(t, c0 + .7, c0 + 1.4)), flip = ease(ramp(t, c0 + 1.7, c0 + 3.05)), leave = ease(ramp(t, c0 + 2.6, c0 + 3.4))

    card.style.transform = `translateZ(${-leave * 900}px) translateY(${Math.sin(t * 1.4) * 8 - leave * 120}px) rotateY(${flip * 180 + Math.sin(t * .9) * 6}deg) rotateX(${Math.sin(t * .7) * 4}deg) scale(${.9 + .1 * appear})`
    for (const f of card.children) f.style.filter = `blur(${(1 - appear) * 18}px) brightness(${1 + (1 - appear) * 1.6})`
    $('glint').style.opacity = env(t, c0 + 3.15, c0 + 3.35, c0 + 3.65, c0 + 3.95)
    $('glint').style.transform = `translateX(${lerp(-110, 110, ramp(t, c0 + 3.15, c0 + 3.95))}%)`
  } else cwrap.style.opacity = 0
  const ro = env(t, 23.9, 24.5, 25.5, 26.0); $('runes').style.opacity = ro
  if (ro > 0) {
    const lit = easeOut(ramp(t, 24.6, 25.1))
    rune.el.style.transform = `translateY(${(1 - easeOut(ramp(t, 23.9, 24.7))) * 140 + Math.sin(t * 1.1) * 14}px) rotate(${Math.sin(t * .8) * 5}deg) scale(${.92 + .08 * easeOut(ramp(t, 23.9, 24.7))})`
    rune.path.setAttribute('stroke-dashoffset', 1 - lit)
    rune.glow.setAttribute('opacity', lit * (.7 + .3 * Math.sin(t * 5)))
  }

  // ---- a giant Moon over the dark ocean ----
  const mw = $('moonWrap'), moon = $('moon'), halo = $('moonHalo')
  if (t > 27.0 && t < 30.9) {
    const rise = easeOut(ramp(t, 27.3, 30.0)), m = ease(ramp(t, 30.0, 30.7)), HZ = 833
    let cx = 576, cy = lerp(HZ + 340, HZ + 40, rise), r = 340   // a giant Moon, half out of the sea
    if (m > 0 && ps) { const [tx, ty] = onScreen(ps, 320, 56 + .244 * 1385); cx = lerp(cx, tx, m); cy = lerp(cy, ty, m); r = lerp(340, 160 * ps.s, m) }
    moon.style.left = cx - r + 'px'; moon.style.top = cy - r + 'px'; moon.style.width = moon.style.height = 2 * r + 'px'
    halo.style.left = cx - r * 2.4 + 'px'; halo.style.top = cy - r * 2.4 + 'px'; halo.style.width = halo.style.height = r * 4.8 + 'px'; halo.style.opacity = rise * (1 - m)
    mw.style.opacity = ramp(t, 27.0, 27.5) * (1 - ramp(t, 30.45, 30.85))
    const horizon = HZ                                     // the waterline holds: it rises out of the sea and sinks back into it
    mw.style.webkitMaskImage = `linear-gradient(180deg, #000 ${horizon - 4}px, transparent ${horizon + 2}px)`
  } else mw.style.opacity = 0
  const rf = env(t, 27.8, 29.6, 29.9, 30.6)
  $('reflect').style.opacity = rf * .55; $('reflect').style.left = '436px'; $('reflect').style.top = '840px'
  if (rf > 0) drawReflect(t)

  // ---- convergence into a golden point ----
  const conv = ramp(t, 33.1, 36.9), alive = t >= 33.0 && t < CUT_AT
  const spin = SWIRL_SPEED[Math.round(t * 96)] * 1.6
  for (const o of OEL) {
    if (!alive) { o.el.style.opacity = 0; continue }
    const R = 540 * o.r * Math.pow(1 - easeIn(conv), .9), a = o.a + spin
    const depth = (Math.sin(a) + 1) / 2, x = 540 + Math.cos(a) * R, y = 1000 + Math.sin(a) * R * .58
    const s = (.62 + .55 * depth) * (1 - .6 * easeIn(conv)), w = parseFloat(o.el.style.width), h = parseFloat(o.el.style.height)
    o.el.style.transform = `translate(${x - w / 2}px, ${y - h / 2}px) scale(${s}) rotate(${Math.sin(a) * 8}deg)`
    o.el.style.opacity = ramp(t, 33.1, 33.8) * (1 - ramp(t, 36.55, 36.95))
    o.el.style.zIndex = Math.round(depth * 10)
    o.el.style.filter = `brightness(${.7 + .5 * depth}) blur(${(1 - depth) * 1.5}px)`
  }
  const core = $('core'), cs = alive ? 70 + 1500 * Math.pow(conv, 3) : 0
  core.style.width = core.style.height = cs + 'px'; core.style.marginLeft = core.style.marginTop = -cs / 2 + 'px'
  core.style.opacity = alive ? (.25 + .75 * conv) * ramp(t, 33.0, 33.6) : 0

  // ---- phone ----
  const phone = $('phone')
  if (ps) {
    phone.style.opacity = ps.o
    phone.style.transform = `translate(${PH_X + 342 * (PH_S - ps.s)}px, ${PH_Y + ps.dy}px) scale(${ps.s})`
    const shot = SHOTS.find((s) => t >= s.t0 && t < s.t1) ?? SHOTS.find((s) => s.t0 > t && s.t0 - t < 1) ?? SHOTS.filter((s) => s.t0 <= t).slice(-1)[0]
    const prev = SHOTS[SHOTS.indexOf(shot) - 1]
    await setImg($('imgA'), frameSrc(shot.clip, clamp(t - shot.t0 + shot.from, 0, 99)), 1)
    const xf = prev && Math.abs(prev.t1 - shot.t0) < .01 ? ramp(t, shot.t0, shot.t0 + .2) : 1
    if (xf < 1) await setImg($('imgB'), frameSrc(prev.clip, t - prev.t0 + prev.from), 1 - xf)
    else $('imgB').style.opacity = 0
  } else phone.style.opacity = 0

  drawFx(t)

  // ---- the brand moment ----
  setFlare($('flare'), t, REVEAL, 760, 620)
  const mark = $('mark'), mi = ramp(t, 37.45, 38.1)
  mark.style.opacity = mi; mark.style.transform = `scale(${.55 + .45 * easeOut(mi)}) rotate(${(t - 37.45) * 6}deg)`
  for (const [id, a, b, o] of [['mk1', 37.7, 38.5, .32], ['mk2', 37.8, 38.7, .6], ['mk3', 37.9, 38.8, .85]]) $(id).style.opacity = ease(ramp(t, a, b)) * o
  $('mk4').style.opacity = $('mk5').style.opacity = ramp(t, 38.4, 38.9)
  const wo = easeOut(ramp(t, 38.3, 39.2)); $('word').style.opacity = wo; $('word').style.letterSpacing = `${.46 + .2 * (1 - wo)}em`
  const tg = easeOut(ramp(t, 39.35, 40.2)); $('tagline').style.opacity = tg
  $('tagline').style.letterSpacing = `${.06 + .1 * (1 - tg)}em`; $('tagline').style.filter = `blur(${(1 - tg) * 8}px) drop-shadow(0 6px 30px rgba(0,0,0,.7))`

  setCaps(activeCaps, t)

  // ---- flashes: into the cosmos, the convergence ----
  $('flash').style.opacity = Math.max(.35 * Math.exp(-(((t - 13.55) / .12) ** 2)), t < CUT_AT ? .95 * easeIn(ramp(t, 36.45, 36.98)) : 0,
    MIX ? .85 * Math.exp(-(((t - 6.4) / .16) ** 2)) : 0)     // the mix: the push into the eclipse
  const gr = rng(Math.floor(t * FPS) + 1)
  $('grain').style.transform = `translate(${Math.round(gr() * 180)}px, ${Math.round(gr() * 180)}px)`
  await document.fonts.ready
}
