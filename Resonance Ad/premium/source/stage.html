<script>

const FPS = 24, W = 1080, H = 1920, DPR = 2
const $ = (id) => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ramp = (t, a, b) => clamp((t - a) / (b - a))
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)
const easeIn = (x) => Math.pow(clamp(x), 3)
const lerp = (a, b, k) => a + (b - a) * k
const env = (t, a, b, c, d) => ramp(t, a, b) * (1 - ramp(t, c, d))     // fade in a→b, out c→d
const rng = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }
const NS = 'http://www.w3.org/2000/svg'
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.appendChild(e); return e }
const VS = '︎'

/* ------------------------------------------------------------ the edit */
// voice lines, pinned to where they are actually spoken (see mix.mjs offsets)

]

/* ------------------------------------------------------------ stars */
const stars = $('stars'), sctx = stars.getContext('2d')
stars.width = W * DPR; stars.height = H * DPR; sctx.scale(DPR, DPR)
const STARS = (() => { const r = rng(7); return Array.from({ length: 1100 }, () => ({ x: (r() * 2 - 1) * 1.4, y: (r() * 2 - 1) * 1.4, z: r(), m: .5 + r() * .9, w: r() < .12 })) })()
const speedAt = (t) => {
  if (t < 5.3) return 0.025 + 0.05 * (t / 5.3)
  if (t < 6.3) return 0.075 + 0.9 * Math.sin(Math.PI * ramp(t, 5.3, 6.3))
  if (t < 31.5) return 0.03
  if (t < 39) return 0.04 + 1.4 * Math.pow(ramp(t, 31.5, 38.95), 2.6)
  return 0.006
}
const DIST = (() => { const a = [0]; let d = 0; for (let i = 1; i <= 46 * 96; i++) { d += speedAt(i / 96) / 96; a.push(d) } return a })()
const distAt = (t) => DIST[Math.min(DIST.length - 1, Math.max(0, Math.round(t * 96)))]
function drawStars(t, alpha, cx = 540, cy = 900) {
  sctx.clearRect(0, 0, W, H)
  if (alpha <= 0) return
  const D = distAt(t), sp = speedAt(t), f = 520
  sctx.globalCompositeOperation = 'lighter'
  for (const s of STARS) {
    const z = 1 - ((1 - s.z + D) % 1)                // 1 = far, → 0 = passing the camera
    const zz = 0.02 + z * 0.98
    const x = cx + s.x / zz * f * .5, y = cy + s.y / zz * f * .5
    if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue
    const near = 1 - z, a = alpha * clamp(near * 1.6) * clamp(z * 8) * s.m
    const tw = 0.75 + 0.25 * Math.sin(t * 2.3 + s.x * 40)
    const size = (0.5 + near * 2.6) * s.m
    sctx.fillStyle = s.w ? `rgba(255,228,170,${a * tw})` : `rgba(230,236,255,${a * tw})`
    if (sp > 0.25) {                                   // warp streaks
      const z2 = Math.min(1, zz + sp * 0.05)
      const x2 = cx + s.x / z2 * f * .5, y2 = cy + s.y / z2 * f * .5
      sctx.strokeStyle = sctx.fillStyle; sctx.lineWidth = size * .9
      sctx.beginPath(); sctx.moveTo(x2, y2); sctx.lineTo(x, y); sctx.stroke()
    } else { sctx.beginPath(); sctx.arc(x, y, size, 0, Math.PI * 2); sctx.fill() }
  }
  sctx.globalCompositeOperation = 'source-over'
}

}

const fx = $('fx'), fctx = fx.getContext('2d')

const DUST = (() => { const r = rng(11); return Array.from({ length: 900 }, () => { const a = r() * Math.PI * 2, d = 520 + r() * 700; return { sx: 540 + Math.cos(a) * d, sy: 1010 + Math.sin(a) * d * 1.2, tx: 290 + r() * 500, ty: 584 + r() * 852, t0: 21.75 + r() * .55, dur: .8 + r() * .5, s: .8 + r() * 2.2, curl: (r() - .5) * 2 } }) })()
const SWIRL = (() => { const r = rng(23); return Array.from({ length: 700 }, () => ({ a: r() * Math.PI * 2, r0: 260 + r() * 900, off: r(), rate: .18 + r() * .25, s: .6 + r() * 1.8 })) })()
const MOTES = (() => { const r = rng(31); return Array.from({ length: 170 }, () => ({ x: r() * W, y: 300 + r() * 1300, vx: (r() - .5) * 14, vy: -6 - r() * 16, s: .6 + r() * 2.2, ph: r() * 6 })) })()
const BURST = (() => { const r = rng(41); return Array.from({ length: 260 }, () => ({ a: r() * Math.PI * 2, v: 300 + r() * 1100, s: .7 + r() * 2.4 })) })()
const SWIRL_SPEED = (() => { const a = [0]; let d = 0; for (let i = 1; i <= 46 * 96; i++) { const t = i / 96; d += (t < 31.5 ? 0 : .35 + 3.2 * Math.pow(ramp(t, 31.5, 38.95), 2.2)) / 96; a.push(d) } return a })()
const dot = (x, y, s, a, c = '255,226,160') => { fctx.fillStyle = `rgba(${c},${a})`; fctx.beginPath(); fctx.arc(x, y, s, 0, Math.PI * 2); fctx.fill() }
function drawFx(t) {
  fctx.clearRect(0, 0, W, H)
  fctx.globalCompositeOperation = 'lighter'
  // gold dust gathering into the tarot card

    const k = ramp(t, p.t0, p.t0 + p.dur); if (k <= 0) continue
    const e = easeOut(k), sw = Math.sin(e * Math.PI) * 120 * p.curl

  if (sa > 0) {
    const D = SWIRL_SPEED[Math.round(t * 96)]
    for (const p of SWIRL) {
      const ph = (p.off + D * p.rate) % 1, r = p.r0 * Math.pow(1 - ph, 1.6), a = p.a + ph * 4.2
      dot(540 + Math.cos(a) * r, 1000 + Math.sin(a) * r * .62, p.s * (1 - ph * .5), sa * Math.sin(ph * Math.PI) * .85)

}

window.setTime = async (t) => {
  // ---- backgrounds ----
  const bgs = {

    if (id === 'bgLake') { sc = 1.03 + .008 * (t - 13.5); ty = (t - 13.5) * 4; br = .92 - .3 * ramp(t, 16.8, 17.8); blur = 6 * ramp(t, 16.9, 17.8) }

  const ecl = $('eclipse')

  $('eclipseDisc').style.opacity = ecl.style.opacity > 0 ? 1 : 0
  $('eclipseDisc').style.transform = ecl.style.transform
  ecl.style.filter = `brightness(${.75 + .5 * pulse + .8 * push}) saturate(1.1)`

  // ---- S2 the chart forming in the stars ----

    const m = ease(ramp(t, 9.85, 10.65))

    halo.style.left = cx - r * 2.6 + 'px'; halo.style.top = cy - r * 2.6 + 'px'; halo.style.width = halo.style.height = r * 5.2 + 'px'

  } else cwrap.style.opacity = 0
  const rw = $('runes'); rw.style.opacity = env(t, 25.8, 26.1, 27.9, 28.0)
  if (t > 25.8 && t < 28) for (const r of RUNES) {
    const k = easeOut(ramp(t, r.rise, r.rise + .7)), lit = easeOut(ramp(t, r.at, r.at + .5))
    r.el.style.transform = `translateY(${(1 - k) * 260 + Math.sin(t * 1.2 + r.x) * 6}px) scale(${.9 + .1 * k})`
    r.el.style.opacity = k * (r.s < 300 ? .82 : 1)
    r.el.style.filter = r.s < 300 ? 'blur(1.2px) brightness(.85)' : 'none'
    r.path.setAttribute('stroke-dashoffset', 1 - lit)
    r.glow.setAttribute('opacity', lit * (.7 + .3 * Math.sin(t * 5 + r.x)))
  }

  // ---- S5 meditation: golden breathing waves ----
  const ro = env(t, 28.0, 28.4, 29.3, 29.8); $('rings').style.opacity = ro
  if (ro > 0) RINGS.forEach((c, i) => { const ph = ((t - 28) * .9 + i / RINGS.length) % 1; c.setAttribute('r', 40 + ph * 760); c.setAttribute('stroke-opacity', (1 - ph) * .55); c.setAttribute('stroke-width', 3 - ph * 2) })

  // ---- S6 the cosmos converging ----
  const conv = ramp(t, 31.7, 38.9), alive = t >= 31.6 && t < 39
  const spin = SWIRL_SPEED[Math.round(t * 96)] * 1.6
  for (const o of OEL) {
    if (!alive) { o.el.style.opacity = 0; continue }
    const R = 540 * o.r * Math.pow(1 - easeIn(conv), .9), a = o.a + spin
    const depth = (Math.sin(a) + 1) / 2, x = 540 + Math.cos(a) * R, y = 1000 + Math.sin(a) * R * .58
    const s = (.62 + .55 * depth) * (1 - .6 * easeIn(conv))
    const w = parseFloat(o.el.style.width), h = parseFloat(o.el.style.height)
    o.el.style.transform = `translate(${x - w / 2}px, ${y - h / 2}px) scale(${s}) rotate(${Math.sin(a) * 8}deg)`
    o.el.style.opacity = ramp(t, 31.8, 32.6) * (1 - ramp(t, 38.55, 38.95))
    if (!o.screen) o.el.style.zIndex = Math.round(depth * 10)
    o.el.style.filter = `brightness(${.7 + .5 * depth}) blur(${(1 - depth) * 1.5}px)`
  }
  const core = $('core'), cs = alive ? 70 + 1500 * Math.pow(conv, 3) : 0
  core.style.width = core.style.height = cs + 'px'; core.style.marginLeft = core.style.marginTop = -cs / 2 + 'px'
  core.style.opacity = alive ? (.25 + .75 * conv) * ramp(t, 31.6, 32.4) : 0

  // ---- phone ----
  const phone = $('phone')
  if (ps) {
    phone.style.opacity = ps.o
    phone.style.transform = `translate(${PH_X + 342 * (PH_S - ps.s)}px, ${PH_Y + ps.dy}px) scale(${ps.s})`
    const shot = SHOTS.find((s) => t >= s.t0 && t < s.t1) ?? SHOTS.find((s) => s.t0 > t && s.t0 - t < 1) ?? SHOTS.filter((s) => s.t0 <= t).slice(-1)[0]
    const prev = SHOTS[SHOTS.indexOf(shot) - 1]
    const local = clamp(t - shot.t0 + shot.from, 0, 99)
    await setImg($('imgA'), frameSrc(shot.clip, local), 1)
    const xf = prev && prev.t1 === shot.t0 ? ramp(t, shot.t0, shot.t0 + .2) : 1
    if (xf < 1) await setImg($('imgB'), frameSrc(prev.clip, t - prev.t0 + prev.from), 1 - xf)
    else $('imgB').style.opacity = 0
  } else phone.style.opacity = 0

  // ---- particles ----
  drawFx(t)

  // ---- S7 the reveal ----
  const fl = $('flare'), fk = t - 39.05
  if (fk >= 0) {
    const grow = easeOut(clamp(fk / .4)), settle = ease(ramp(t, 39.6, 40.6))
    fl.style.opacity = 1
    const gs = lerp(0, 760, grow) * (1 - .45 * settle) * (1 + .03 * Math.sin(t * 2.2))
    const glow = fl.querySelector('.glow'); glow.style.width = glow.style.height = gs + 'px'; glow.style.left = glow.style.top = -gs / 2 + 'px'
    glow.style.opacity = 1 - .35 * settle
    const st = fl.querySelector('.streak'), sw = lerp(0, 1500, grow) * (1 - .5 * settle)
    st.style.width = sw + 'px'; st.style.left = -sw / 2 + 'px'; st.style.top = '-5px'; st.style.opacity = .85 - .55 * settle
    if (!fl.rays) fl.rays = [0, 45, 90, 135, 180, 225, 270, 315].map((a) => { const d = document.createElement('div'); d.className = 'ray'; d.dataset.a = a; fl.appendChild(d); return d })
    for (const r of fl.rays) {
      const a = +r.dataset.a, len = (a % 90 ? 260 : 620) * grow * (1 - .5 * settle)
      r.style.width = len + 'px'; r.style.transform = `rotate(${a + fk * 4}deg) translateY(-3px)`; r.style.opacity = (a % 90 ? .55 : .95) * (1 - .45 * settle)
    }
  } else fl.style.opacity = 0
  const mark = $('mark'), mi = ramp(t, 39.45, 40.1)
  mark.style.opacity = mi
  mark.style.transform = `scale(${.55 + .45 * easeOut(mi)}) rotate(${(t - 39.45) * 6}deg)`
  for (const [id, a, b] of [['mk1', 39.7, 40.5], ['mk2', 39.8, 40.7], ['mk3', 39.9, 40.8]]) {
    const el = $(id), k = ease(ramp(t, a, b))
    el.style.opacity = k * (id === 'mk1' ? .32 : id === 'mk2' ? .6 : .85)
  }
  $('mk4').style.opacity = $('mk5').style.opacity = ramp(t, 40.4, 40.9)
  const wo = easeOut(ramp(t, 40.3, 41.2)); $('word').style.opacity = wo; $('word').style.letterSpacing = `${.46 + .2 * (1 - wo)}em`
  const evOut = ramp(t, 44.25, 44.6)
  for (const [id, a] of [['ev1', 39.85], ['ev2', 42.68]]) {
    const k = easeOut(ramp(t, a - .05, a + .5)), el = $(id)
    el.style.opacity = k * (1 - evOut); el.style.transform = `translateY(${(1 - k) * 20}px)`; el.style.filter = `blur(${(1 - k) * 8}px)`
  }
  const el = $('endLines'), e1 = easeOut(ramp(t, 44.55, 45.05))
  el.style.opacity = e1; el.style.transform = `translateY(${(1 - e1) * 24}px)`
  el.querySelector('.cta').style.opacity = easeOut(ramp(t, 44.8, 45.25))
  el.querySelector('.cta').style.transform = `scale(${.94 + .06 * easeOut(ramp(t, 44.8, 45.25))})`
  el.querySelector('.small').style.opacity = easeOut(ramp(t, 45.05, 45.45))

  // ---- text ----
  setText(t)

  // ---- flashes: the push into the eclipse, the drop, the convergence ----
  const flash = Math.max(
    Math.pow(Math.sin(Math.PI * ramp(t, 5.75, 6.55)), 2) * .9,
    // the drop: builds over two frames into the hit, then decays (an instant white frame reads as a glitch)
    t >= 27.92 ? .75 * (1 - Math.exp(-(t - 27.92) * 30)) * Math.exp(-Math.max(0, t - 28) * 6) : 0,
    t < 39 ? .95 * easeIn(ramp(t, 38.45, 38.98)) : 0,
  )
  $('flash').style.opacity = flash

  // ---- grain ----
  const gr = rng(Math.floor(t * FPS) + 1)
  $('grain').style.transform = `translate(${Math.round(gr() * 180)}px, ${Math.round(gr() * 180)}px)`
  await document.fonts.ready
}
