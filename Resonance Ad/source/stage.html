<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fraunces'; src: url('FONT_DIR/fraunces/files/fraunces-latin-full-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Inter'; src: url('FONT_DIR/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  :root { --gold-hi: #fbecc4; --gold: #e8c274; --gold-lo: #b9862f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05060f; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05060f; }

  .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; opacity: 0; will-change: transform, opacity, filter; }
  .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,5,13,.72) 0%, rgba(4,5,13,.25) 30%, rgba(4,5,13,.35) 60%, rgba(4,5,13,.88) 100%); }

  /* the hook's orbit rings around the moon */
  #orbits { position: absolute; left: 50%; top: 45%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; opacity: 0; }
  #orbits svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  #phone { position: absolute; left: 198px; top: 560px; transform-origin: 50% 0; width: 684px; height: 1485px; border-radius: 96px;
    background: linear-gradient(160deg, #2a2418, #0c0b10 30%, #0c0b10 70%, #2a2418);
    box-shadow: 0 0 0 2px rgba(232,194,116,.55), 0 0 0 9px rgba(12,11,16,.9), 0 40px 120px -20px rgba(0,0,0,.9), 0 0 110px -10px rgba(232,194,116,.35);
    will-change: transform, opacity; }
  #screen { position: absolute; left: 22px; top: 22px; width: 640px; height: 1441px; border-radius: 76px; overflow: hidden; background: #05060f; }
  #screen img { position: absolute; left: 0; top: 56px; width: 640px; height: 1385px; }
  #status { position: absolute; left: 0; right: 0; top: 0; height: 56px; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 6px 56px 0 64px;
    background: #070812; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 25px; color: #f2f3f8; }
  #status svg { height: 22px; }
  #island { position: absolute; left: 50%; top: 32px; width: 150px; height: 40px; margin-left: -75px; border-radius: 22px; background: #000; z-index: 3; }

  #cap { position: absolute; left: 70px; right: 70px; top: 300px; height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .line { font-family: 'Fraunces', serif; font-weight: 600; font-size: 78px; line-height: 1.06; letter-spacing: -0.015em;
    background: linear-gradient(160deg, #fdf3d6 0%, #f1d38d 45%, #d2a85a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 24px rgba(0,0,0,.65)); will-change: transform, opacity, filter; }
  .sub { margin-top: 18px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 38px; color: rgba(236,232,250,.92); letter-spacing: .01em; text-shadow: 0 2px 18px rgba(0,0,0,.8); }

  #hook { position: absolute; left: 60px; right: 60px; top: 330px; text-align: center; }
  #hook .line { font-size: 104px; }

  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 330px; text-align: center; opacity: 0; }
  #end svg { width: 190px; height: 190px; color: var(--gold); filter: drop-shadow(0 0 30px rgba(232,194,116,.7)); }
  #end .word { margin-top: 36px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 46px; letter-spacing: .42em; margin-right: -.42em;
    background: linear-gradient(160deg, #fdf3d6, #e8c274 55%, #c99b45); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #end .tag { margin-top: 34px; font-family: 'Fraunces', serif; font-weight: 500; font-size: 84px; line-height: 1.08; color: #fbf3df; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
  #end .cta { margin-top: 70px; padding: 30px 64px; border-radius: 999px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 44px; color: #1a1206;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 46%, var(--gold-lo)); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 20px 60px -16px rgba(232,194,116,.6); }
  #end .small { margin-top: 26px; font-family: 'Inter', sans-serif; font-size: 30px; color: rgba(236,232,250,.75); letter-spacing: .02em; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg-hero"></div>
  <div class="bg" id="bg-sky"></div>
  <div class="bg" id="bg-practice"></div>
  <div class="bg" id="bg-tarot"></div>
  <div class="bg" id="bg-welcome"></div>
  <div class="veil"></div>

  <div id="orbits">
    <svg viewBox="0 0 200 200" id="o1"><ellipse cx="100" cy="100" rx="78" ry="30" transform="rotate(-18 100 100)" fill="none" stroke="#e8c274" stroke-opacity=".5" stroke-width=".3"/><circle cx="174" cy="76" r="1.5" fill="#fbecc4"/><circle cx="174" cy="76" r="4" fill="#e8c274" opacity=".25"/></svg>
    <svg viewBox="0 0 200 200" id="o2"><ellipse cx="100" cy="100" rx="64" ry="22" transform="rotate(24 100 100)" fill="none" stroke="#c9b6ff" stroke-opacity=".35" stroke-width=".28" stroke-dasharray="1.5 2.5"/><circle cx="40" cy="74" r="1.1" fill="#e6dcff"/></svg>
  </div>

  <div id="hook"><div class="line" id="hookLine">The sky changed today.</div><div class="sub" id="hookSub">Did you feel it?</div></div>

  <div id="phone"><div id="island"></div><div id="screen"><div id="status"><span>9:41</span><span style="display:flex;gap:10px;align-items:center">
      <svg viewBox="0 0 36 22"><rect x="0" y="14" width="6" height="8" rx="1.5" fill="#f2f3f8"/><rect x="10" y="9" width="6" height="13" rx="1.5" fill="#f2f3f8"/><rect x="20" y="4" width="6" height="18" rx="1.5" fill="#f2f3f8"/><rect x="30" y="0" width="6" height="22" rx="1.5" fill="#f2f3f8"/></svg>
      <svg viewBox="0 0 30 22"><path d="M15 21 10.5 16a6.4 6.4 0 0 1 9 0Z M5.5 11a13.5 13.5 0 0 1 19 0l-2.6 2.6a9.8 9.8 0 0 0-13.8 0Z M0.6 6a20.4 20.4 0 0 1 28.8 0l-2.6 2.6a16.7 16.7 0 0 0-23.6 0Z" fill="#f2f3f8"/></svg>
      <svg viewBox="0 0 46 22"><rect x="1" y="1" width="38" height="20" rx="6" fill="none" stroke="#f2f3f8" stroke-opacity=".5" stroke-width="2"/><rect x="4" y="4" width="28" height="14" rx="3.5" fill="#f2f3f8"/><rect x="41" y="7" width="4" height="8" rx="2" fill="#f2f3f8" fill-opacity=".5"/></svg>
    </span></div><img id="imgA" /><img id="imgB" /></div></div>

  <div id="cap"><div class="line" id="capLine"></div></div>

  <div id="end">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="24" cy="24" r="22.5" stroke-width="1" opacity=".32"/>
      <circle cx="24" cy="24" r="18" stroke-dasharray="42 14.55" stroke-dashoffset="28.3" opacity=".6"/>
      <circle cx="24" cy="24" r="12.5" stroke-dasharray="29 10.27" opacity=".85" transform="rotate(45 24 24)"/>
      <circle cx="24" cy="6" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="42" cy="24" r="1.1" fill="currentColor" stroke="none" opacity=".7"/>
      <path d="M24 12c1.2 7.6 4.4 10.8 12 12-7.6 1.2-10.8 4.4-12 12-1.2-7.6-4.4-10.8-12-12 7.6-1.2 10.8-4.4 12-12Z" fill="currentColor" stroke="none"/>
    </svg>
    <div class="word">RESONANCE</div>
    <div class="tag">Your sky,<br/>read for you</div>
    <div class="cta">Free on Google Play</div>
    <div class="small">Astrology · Tarot · Runes · Meditation</div>
  </div>
</div>

<script>
const ART = 'ART_DIR', CLIPS = 'CLIP_DIR'
for (const [id, f] of [['bg-hero','hero-today-tall'],['bg-sky','bg-sky'],['bg-practice','bg-practice'],['bg-tarot','bg-tarot'],['bg-welcome','bg-welcome']])
  document.getElementById(id).style.backgroundImage = `url(${ART}/${f}.webp)`

// the cut list — [start, end) in ad seconds; `from` = where in the clip to begin
const SHOTS = [
  { clip: 'today',    t0: 3.2,  t1: 7.6,  from: 0.1, cap: 'A daily reading from<br/>your own birth chart', bg: 'bg-hero' },
  { clip: 'chart',    t0: 7.6,  t1: 11.8, from: 0.15, cap: 'Real planets.<br/>Your real chart.', bg: 'bg-sky' },
  { clip: 'chakra',   t0: 11.8, t1: 15.6, from: 0.15, cap: 'See where today’s<br/>sky lands in you', bg: 'bg-practice' },
  { clip: 'tarot',    t0: 15.6, t1: 18.0, from: 0.15, cap: 'Daily tarot<br/>&amp; rune readings', bg: 'bg-tarot' },
  { clip: 'rune',     t0: 18.0, t1: 20.2, from: 0.2, cap: 'Daily tarot<br/>&amp; rune readings', bg: 'bg-tarot' },
  { clip: 'breath',   t0: 20.2, t1: 24.0, from: 0.25, cap: 'A practice made<br/>for your day', bg: 'bg-practice' },
  { clip: 'moon',     t0: 24.0, t1: 25.4, from: 0.3, cap: 'Moon · Transits<br/>· Compatibility', bg: 'bg-sky' },
  { clip: 'transits', t0: 25.4, t1: 26.6, from: 0.2, cap: 'Moon · Transits<br/>· Compatibility', bg: 'bg-sky' },
  { clip: 'compat',   t0: 26.6, t1: 27.7, from: 0.2, cap: 'Moon · Transits<br/>· Compatibility', bg: 'bg-sky' },
]
const FRAMES = window.__FRAMES // { clip: count }
const FPS = 30
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = (x) => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2 }
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)
const ramp = (t, a, b) => clamp((t - a) / (b - a))
const frameSrc = (clip, local) => `${CLIPS}/${clip}/${String(Math.min(FRAMES[clip] - 1, Math.max(0, Math.round(local * FPS)))).padStart(4, '0')}.jpg`
const $ = (id) => document.getElementById(id)

async function setImg(img, src, op) {
  img.style.opacity = op
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; await img.decode().catch(() => {}) }
}

window.setTime = async (t) => {
  // ---- backgrounds: each section's scene, crossfading, slowly drifting ----
  const shot = SHOTS.find((s) => t >= s.t0 && t < s.t1)
  const prev = shot ? SHOTS[SHOTS.indexOf(shot) - 1] : null
  const want = {}
  if (t < 3.2) want['bg-hero'] = 1
  else if (t >= 27.7) { want['bg-welcome'] = ramp(t, 27.7, 28.5); if (want['bg-welcome'] < 1) want['bg-sky'] = 1 - want['bg-welcome'] }
  else if (shot) {
    const k = prev && prev.bg !== shot.bg ? ramp(t, shot.t0, shot.t0 + .6) : 1
    want[shot.bg] = k; if (k < 1) want[prev.bg] = (want[prev.bg] ?? 0) + 1 - k
  }
  for (const id of ['bg-hero','bg-sky','bg-practice','bg-tarot','bg-welcome']) {
    const el = $(id), o = want[id] ?? 0
    el.style.opacity = o
    const blur = id === 'bg-hero' ? 22 * ramp(t, 2.5, 3.6) : 16
    const scale = 1.04 + 0.006 * t
    el.style.transform = `scale(${scale}) translateY(${-t * 3}px)`
    el.style.filter = `blur(${blur}px) brightness(${id === 'bg-hero' && t < 3.2 ? 1 : .62}) saturate(1.1)`
  }
  // the hook is the photograph itself: crisp, full-strength
  if (t < 3.6) { $('bg-hero').style.filter = `blur(${22 * ramp(t, 2.5, 3.6)}px) brightness(${1 - .38 * ramp(t, 2.5, 3.6)})`; $('bg-hero').style.transform = `scale(${1.02 + .045 * (t / 3.2)})` }

  // ---- the hook ----
  $('orbits').style.opacity = (ramp(t, .2, 1.2)) * (1 - ramp(t, 2.6, 3.2))
  $('o1').style.transform = `rotate(${t * 9}deg)`; $('o2').style.transform = `rotate(${-t * 6}deg)`
  const hIn = easeOut(ramp(t, .25, 1.0)), hOut = ramp(t, 2.55, 3.05)
  $('hookLine').style.opacity = hIn * (1 - hOut)
  $('hookLine').style.transform = `translateY(${(1 - hIn) * 30 - hOut * 20}px)`
  $('hookLine').style.filter = `blur(${(1 - hIn) * 10}px) drop-shadow(0 4px 30px rgba(0,0,0,.7))`
  const sIn = easeOut(ramp(t, 1.15, 1.8))
  $('hookSub').style.opacity = sIn * (1 - hOut)
  $('hookSub').style.transform = `translateY(${(1 - sIn) * 20}px)`

  // ---- the phone: rises in after the hook, floats, sinks before the end card ----
  const pin = ease(ramp(t, 2.75, 3.6)), pout = ease(ramp(t, 27.4, 28.2))
  const float = Math.sin(t * 1.3) * 6
  $('phone').style.opacity = pin * (1 - pout)
  $('phone').style.transform = `translateY(${(1 - pin) * 420 + pout * 140 + float}px) scale(${(.94 + .06 * pin - .04 * pout) * .88})`

  // ---- the app itself, cut by cut, with a short dissolve between shots ----
  const imgA = $('imgA'), imgB = $('imgB')
  if (shot) {
    const local = t - shot.t0 + shot.from
    const xf = prev ? ramp(t, shot.t0, shot.t0 + .25) : 1
    await setImg(imgA, frameSrc(shot.clip, local), 1)
    if (xf < 1) await setImg(imgB, frameSrc(prev.clip, t - prev.t0 + prev.from), 1 - xf)
    else imgB.style.opacity = 0
  } else if (t < 3.2) {
    await setImg(imgA, frameSrc('today', 0), 1); imgB.style.opacity = 0
  } else {
    const last = SHOTS[SHOTS.length - 1]
    await setImg(imgA, frameSrc(last.clip, last.t1 - last.t0 + last.from), 1); imgB.style.opacity = 0
  }

  // ---- captions: in with a rise and unblur, out softly before the next ----
  const cap = $('capLine')
  if (shot) {
    const groupStart = SHOTS.filter((s) => s.cap === shot.cap)[0].t0
    const groupEnd = SHOTS.filter((s) => s.cap === shot.cap).slice(-1)[0].t1
    if (cap.innerHTML !== shot.cap) cap.innerHTML = shot.cap
    const ci = easeOut(ramp(t, groupStart + .15, groupStart + .7)), co = ramp(t, groupEnd - .35, groupEnd - .02)
    cap.style.opacity = ci * (1 - co)
    cap.style.transform = `translateY(${(1 - ci) * 26 - co * 14}px)`
    cap.style.filter = `blur(${(1 - ci) * 9}px) drop-shadow(0 4px 24px rgba(0,0,0,.65))`
  } else cap.style.opacity = 0

  // ---- end card ----
  const e = easeOut(ramp(t, 27.9, 28.8))
  $('end').style.opacity = e
  $('end').style.transform = `translateY(${(1 - e) * 30}px)`
  document.querySelector('#end svg').style.transform = `rotate(${(t - 27.9) * 8}deg) scale(${.9 + .1 * e})`
  await document.fonts.ready
}
</script>
</body>
</html>
